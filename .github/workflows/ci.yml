name: Build Test Publish

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch: # Allows manual triggering of the workflow

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read # required by actions/checkout once permissions are set explicitly
            id-token: write # enable GitHub OIDC token issuance for NuGet Trusted Publishing

        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Install dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build -c Release --no-restore

            - name: Test
              env:
                  SHOPIFYNET_SHOP_ID: ${{ secrets.SHOPIFYNET_SHOP_ID }}
                  SHOPIFYNET_CLIENT_ID: ${{ secrets.SHOPIFYNET_CLIENT_ID }}
                  SHOPIFYNET_KEY_ID: ${{ secrets.SHOPIFYNET_KEY_ID }}
                  SHOPIFYNET_PRIVATE_KEY: ${{ secrets.SHOPIFYNET_PRIVATE_KEY }}
              run: dotnet test --no-restore --verbosity normal

            # Exchange the GitHub OIDC token for a short-lived (1 hour) NuGet API key via Trusted Publishing
            - name: NuGet login (OIDC -> temp API key)
              if: github.event_name == 'workflow_dispatch' # Only runs when manually triggered for deployment
              uses: NuGet/login@v1
              id: nuget-login
              with:
                  user: BetterReports # nuget.org profile name, NOT email address

            - name: Publish to nuget
              if: github.event_name == 'workflow_dispatch' # Only runs when manually triggered for deployment
              run: dotnet nuget push ShopifyNet/bin/Release/*.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
